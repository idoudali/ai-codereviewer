name: "AI Code Review Action"
description: "Perform code reviews and comment on diffs using OpenAI or any OpenAI-compatible endpoint."
inputs:
  GITHUB_TOKEN:
    description: "GitHub token to interact with the repository."
    required: true
  OPENAI_API_KEY:
    description: "API key. Required for api.openai.com; optional with OPENAI_BASE_URL (a placeholder is sent when a relay holds the real key)."
    required: false
    default: ""
  OPENAI_BASE_URL:
    description: "OpenAI-compatible base URL, for example a LiteLLM gateway ending in /v1. Falls back to the OPENAI_BASE_URL environment variable; empty means api.openai.com."
    required: false
    default: ""
  OPENAI_API_MODEL:
    description: "Model name or alias. Defaults to lab-coder when a base URL is set, else gpt-4."
    required: false
    default: ""
  review_mode:
    description: "summary posts one PR comment (edited on later pushes) and no inline comments; inline posts line comments. Defaults to summary with a base URL, else inline."
    required: false
    default: ""
  max_diff_chars:
    description: "Summary mode sends at most this many characters of diff, whole files only, and names the files it left out."
    required: false
    default: "60000"
  timeout_seconds:
    description: "Timeout for each model request. A timeout skips the review instead of failing the step."
    required: false
    default: "300"
  max_retries:
    description: "Retries per model request on 429, 5xx and timeouts, before a 503 or timeout skips the review."
    required: false
    default: "2"
  exclude:
    description: "Glob patterns to exclude files from the diff analysis"
    required: false
    default: ""
runs:
  using: "node24"
  main: "dist/index.js"
branding:
  icon: "aperture"
  color: "green"
