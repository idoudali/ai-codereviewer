name: Lint workflows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color .github/workflows/gito-review.yml .github/workflows/lint-workflows.yml examples/gito-review-caller.yml
